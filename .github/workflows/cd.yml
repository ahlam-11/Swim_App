name: CD

# Se déclenche APRÈS la complétion du workflow CI sur main ou dev.
# Le déploiement est bloqué automatiquement si la CI est rouge.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]

jobs:
  deploy:
    name: Deploy → ${{ github.event.workflow_run.head_branch == 'main' && 'Production' || 'Staging' }}
    runs-on: ubuntu-latest

    # Ne déploie que si la CI a réussi
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:      ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:     ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # --prod uniquement sur main ; dev → preview URL staging
          vercel-args: ${{ github.event.workflow_run.head_branch == 'main' && '--prod' || '' }}
          working-directory: ./
